name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://junkyardnearme-g6ghdqf5g8gvd2eq.centralindia-01.azurewebsites.net

      - name: Download StaticSitesClient (Linux)
        run: |
          BUILD_ID="08e29138cd3dcda4ffda6d587aa580028110c1c7"
          mkdir -p ~/.swa/deploy
          curl -fsSL "https://swalocaldeployv2-bndtgugjgqc3dhdx.b01.azurefd.net/downloads/${BUILD_ID}/linux/StaticSitesClient" \
            -o ~/.swa/deploy/StaticSitesClient
          chmod +x ~/.swa/deploy/StaticSitesClient
          file ~/.swa/deploy/StaticSitesClient
          ldd ~/.swa/deploy/StaticSitesClient || true

      - name: Deploy to Azure Static Web Apps
        run: ~/.swa/deploy/StaticSitesClient
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_FIELD_015B59200 }}
          # APP_LOCATION is RELATIVE to REPOSITORY_BASE on Linux (binary concatenates them)
          APP_LOCATION: "dist"
          OUTPUT_LOCATION: ""
          SKIP_APP_BUILD: "true"
          SKIP_API_BUILD: "true"
          DEPLOYMENT_ACTION: "upload"
          DEPLOYMENT_PROVIDER: "DevOps"
          REPOSITORY_BASE: ${{ github.workspace }}/frontend
          CONFIG_FILE_LOCATION: ${{ github.workspace }}/frontend
          VERBOSE: "true"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Download StaticSitesClient (Linux)
        run: |
          BUILD_ID="08e29138cd3dcda4ffda6d587aa580028110c1c7"
          mkdir -p ~/.swa/deploy
          curl -fsSL "https://swalocaldeployv2-bndtgugjgqc3dhdx.b01.azurefd.net/downloads/${BUILD_ID}/linux/StaticSitesClient" \
            -o ~/.swa/deploy/StaticSitesClient
          chmod +x ~/.swa/deploy/StaticSitesClient

      - name: Close Pull Request
        run: ~/.swa/deploy/StaticSitesClient
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_FIELD_015B59200 }}
          DEPLOYMENT_ACTION: "close"
          DEPLOYMENT_PROVIDER: "DevOps"
          APP_LOCATION: "."
          REPOSITORY_BASE: ${{ github.workspace }}
