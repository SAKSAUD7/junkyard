name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://junkyardnearme-g6ghdqf5g8gvd2eq.centralindia-01.azurewebsites.net

      - name: Deploy to Azure Static Web Apps
        run: |
          npx --yes @azure/static-web-apps-cli deploy ./dist \
            --deployment-token "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_FIELD_015B59200 }}" \
            --env production \
            --no-use-keychain \
            --verbose
        working-directory: frontend

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Download StaticSitesClient (Linux)
        run: |
          BUILD_ID="08e29138cd3dcda4ffda6d587aa580028110c1c7"
          mkdir -p ~/.swa/deploy
          curl -fsSL "https://swalocaldeployv2-bndtgugjgqc3dhdx.b01.azurefd.net/downloads/${BUILD_ID}/linux/StaticSitesClient" \
            -o ~/.swa/deploy/StaticSitesClient
          chmod +x ~/.swa/deploy/StaticSitesClient

      - name: Close Pull Request
        run: |
          npx --yes @azure/static-web-apps-cli deploy \
            --deployment-token "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_FIELD_015B59200 }}" \
            --env production \
            --no-use-keychain \
            --action close
