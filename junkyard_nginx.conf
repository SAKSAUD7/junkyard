# =============================================================================
# JUNKYARDSNEARME.COM — PRODUCTION NGINX CONFIG
# Django API (port 8000) + React SPA (port 3000 dev / dist/ prod)
# =============================================================================

# ─── 1. HTTP → HTTPS REDIRECT ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name junkyardsnearme.com www.junkyardsnearme.com _;

    # Redirect all HTTP to HTTPS (301 permanent)
    return 301 https://junkyardsnearme.com$request_uri;
}

# ─── 2. WWW → NON-WWW REDIRECT (HTTPS) ────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.junkyardsnearme.com;

    ssl_certificate     /etc/ssl/certs/junkyardsnearme.com.pem;
    ssl_certificate_key /etc/ssl/private/junkyardsnearme.com.key;

    return 301 https://junkyardsnearme.com$request_uri;
}

# ─── 3. MAIN PRODUCTION SERVER (HTTPS NON-WWW) ────────────────────────────────
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name junkyardsnearme.com;

    ssl_certificate     /etc/ssl/certs/junkyardsnearme.com.pem;
    ssl_certificate_key /etc/ssl/private/junkyardsnearme.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/x-font-ttf
        font/opentype
        application/vnd.ms-fontobject;

    # ── Security Headers (ALL responses) ────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"                      always;
    add_header X-Frame-Options           "SAMEORIGIN"                   always;
    add_header X-XSS-Protection         "1; mode=block"                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # Enable HSTS only after confirming SSL is stable on the production domain
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Basic CSP — tighten further once third-party domains are confirmed
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://api.junkyardsnearme.com; frame-src 'self' https://www.google.com;"
        always;

    # ── Static Frontend Assets (React build dist/) ──────────────────────────
    # Uncomment this block when using npm run build (production mode)
    # root /var/www/jynm/frontend/dist;
    # index index.html;
    #
    # location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    # }
    #
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }

    # ── Proxy Frontend → Vite dev server (development/staging mode) ─────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Proxy Backend API → Django (Gunicorn port 8000) ──────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Compression for API responses
        gzip on;
        gzip_types application/json;
    }

    # ── Proxy Django Admin Panel ──────────────────────────────────────────────
    location /admin/ {
        proxy_pass http://127.0.0.1:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Proxy Media Files ──────────────────────────────────────────────────────
    location /media/ {
        proxy_pass http://127.0.0.1:8000/media/;
        expires 30d;
        add_header Cache-Control "public";
    }
}

# =============================================================================
# STAGING / LOCAL FALLBACK (HTTP, no SSL — for local dev only)
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers even for local (good habit)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8000/media/;
    }
}
