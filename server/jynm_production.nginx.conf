# ==============================================================================
# JYNM — Production Nginx Configuration for junkyardsnearme.com
# Hostinger VPS — Ubuntu 22.04
#
# Prerequisites:
#   sudo certbot --nginx -d junkyardsnearme.com -d www.junkyardsnearme.com
#   (Certbot will add/update the SSL blocks automatically)
#
# Apply:
#   sudo cp jynm_production.nginx.conf /etc/nginx/sites-available/jynm
#   sudo ln -sf /etc/nginx/sites-available/jynm /etc/nginx/sites-enabled/jynm
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# Redirect bare HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name junkyardsnearme.com www.junkyardsnearme.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name junkyardsnearme.com www.junkyardsnearme.com;

    # ── SSL (managed by Certbot — do not edit manually) ──────────────────────
    ssl_certificate     /etc/letsencrypt/live/junkyardsnearme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/junkyardsnearme.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Gzip Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        font/eot font/otf font/ttf
        image/svg+xml
        text/css text/javascript text/plain text/xml;

    # ── Document root (React Vite build) ─────────────────────────────────────
    root /home/junkyard/frontend/dist;
    index index.html;

    # ── Hashed assets: cache forever ─────────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary "Accept-Encoding";
        try_files $uri =404;
    }

    # ── Static images/fonts/icons ────────────────────────────────────────────
    location ~* \.(ico|png|jpg|jpeg|gif|webp|avif|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # ── Video files ───────────────────────────────────────────────────────────
    location ~* \.(mp4|webm|ogg|ogv|avi)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # ── robots.txt ───────────────────────────────────────────────────────────
    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # ── sitemap.xml (proxied from Django) ────────────────────────────────────
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000/api/common/sitemap.xml;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=21600";
    }

    # ── API proxy → Gunicorn ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 15s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 64k;
    }

    # ── Django Admin ─────────────────────────────────────────────────────────
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Ad click tracking ────────────────────────────────────────────────────
    location /ads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Media files (user uploads) ────────────────────────────────────────────
    location /media/ {
        alias /home/junkyard/backend/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # ── Django static (admin CSS/JS) ─────────────────────────────────────────
    location /static/ {
        alias /home/junkyard/backend/staticfiles/;
        add_header Cache-Control "public, immutable, max-age=31536000";
        gzip_static on;
        try_files $uri =404;
    }

    # ── SPA fallback (React Router) ───────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        gzip on;
        gzip_static on;
    }

    # ── Upload limit ──────────────────────────────────────────────────────────
    client_max_body_size 20M;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/jynm_access.log combined;
    error_log  /var/log/nginx/jynm_error.log warn;
}
