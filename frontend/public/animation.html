<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junkyard Animation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: #020408;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            perspective: 1000px;
        }

        .bg-layer {
            position: absolute;
            inset: -5%;
            background-image: url('./hero-3d.png');
            background-size: cover;
            background-position: center;
            opacity: 0.6;
            animation: panBg 10s ease-in-out infinite alternate;
        }

        .grid {
            position: absolute;
            inset: -50%;
            bottom: -50%;
            background-image: 
                linear-gradient(rgba(0,212,255,0.1) 2px, transparent 2px), 
                linear-gradient(90deg, rgba(0,212,255,0.1) 2px, transparent 2px);
            background-size: 80px 80px;
            transform: rotateX(60deg) translateY(200px);
            animation: moveGrid 5s linear infinite;
        }

        .engine {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 500px;
            height: 500px;
            margin-top: -250px;
            margin-left: -250px;
            background-image: url('./engine-3d.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 0 50px rgba(0,212,255,0.8));
            animation: floatEngine 4s ease-in-out infinite;
            z-index: 10;
        }

        .overlay-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 40%, #020408 100%);
            z-index: 20;
        }

        .scanline {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 0%, rgba(0,212,255,0.2) 10%, transparent 20%);
            background-size: 100% 10px;
            opacity: 0.5;
            animation: scan 3s linear infinite;
            z-index: 30;
            pointer-events: none;
        }

        @keyframes panBg {
            0% { transform: scale(1.1) translateX(-20px) rotate(1deg); filter: hue-rotate(0deg); }
            100% { transform: scale(1.15) translateX(20px) rotate(-1deg); filter: hue-rotate(15deg); }
        }

        @keyframes moveGrid {
            0% { background-position: 0 0; }
            100% { background-position: 0 80px; }
        }

        @keyframes floatEngine {
            0% { transform: translateY(0px) rotateY(0deg) scale(1); filter: drop-shadow(0 0 30px rgba(0,212,255,0.5)); }
            50% { transform: translateY(-30px) rotateY(5deg) scale(1.05); filter: drop-shadow(0 0 60px rgba(0,212,255,0.9)); }
            100% { transform: translateY(0px) rotateY(0deg) scale(1); filter: drop-shadow(0 0 30px rgba(0,212,255,0.5)); }
        }

        @keyframes scan {
            0% { background-position: 0 -100vh; }
            100% { background-position: 0 100vh; }
        }

    </style>
</head>
<body>
    <div class="scene">
        <div class="bg-layer"></div>
        <div class="grid"></div>
        <div class="engine"></div>
        <div class="overlay-glow"></div>
        <div class="scanline"></div>
    </div>
</body>
</html>
