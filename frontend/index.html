<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/jynm_logo.png" />
  <link rel="apple-touch-icon" href="/jynm_logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0f18" />
  <title>Junkyards Near Me - Find Auto Salvage Yards & Used Auto Parts</title>
  <meta name="description"
    content="Find junkyards and auto salvage yards near you. Search by make, model, part, or location. Get used auto parts from over 1,000 junkyards across the USA." />
  <meta name="robots" content="index, follow" />

  <!-- Canonical domain (fallback before React loads) -->
  <link rel="canonical" href="https://junkyardsnearme.com/" />

  <!-- Open Graph — crawled by social bots before JS executes -->
  <meta property="og:site_name" content="Junkyards Near Me" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Junkyards Near Me - Find Auto Salvage Yards & Used Auto Parts" />
  <meta property="og:description" content="Find junkyards and auto salvage yards near you. Search by make, model, part, or location. Get used auto parts from over 1,000 verified junkyards across the USA." />
  <meta property="og:image" content="https://junkyardsnearme.com/images/og-default.jpg" />
  <meta property="og:url" content="https://junkyardsnearme.com/" />

  <!-- Twitter Card fallback -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://junkyardsnearme.com/images/og-default.jpg" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Preload hero video for LCP improvement -->
  <link rel="preload" as="video" href="/Video/hero-models-bg.mp4" type="video/mp4" />

  <!-- Dark background before JS loads -->
  <style>
    html, body { background-color: #060c14; color: #e8f0fe; }
  </style>

  <!-- Base JSON-LD Structured Data for JYNM Platform -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Junkyards Near Me",
      "url": "https://junkyardsnearme.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://junkyardsnearme.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
  </script>
</head>

<body style="background:#060c14">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
