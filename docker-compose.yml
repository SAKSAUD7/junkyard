version: '3.9'
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    volumes:
      - "./backend:/app"
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - "./frontend:/app"
    ports:
      - "3000:3000"
    command: npm run dev
