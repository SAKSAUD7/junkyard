# ==============================================================================
# JYNM — Production Nginx Configuration
# Domain: junkyardsnearme.com
# Stack:  React 18 (Vite) frontend + Django/Gunicorn backend
#
# Deploy:
#   sudo cp nginx/junkyardsnearme.conf /etc/nginx/sites-available/junkyardsnearme.com
#   sudo ln -sf /etc/nginx/sites-available/junkyardsnearme.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (first time):
#   sudo certbot --nginx -d junkyardsnearme.com -d www.junkyardsnearme.com
# ==============================================================================

# ── 1. HTTP → HTTPS redirect (port 80) ─────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name junkyardsnearme.com www.junkyardsnearme.com;

    # Let Certbot handle ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://junkyardsnearme.com$request_uri;
    }
}

# ── 2. www → non-www redirect (HTTPS) ─────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.junkyardsnearme.com;

    ssl_certificate /etc/letsencrypt/live/junkyardsnearme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/junkyardsnearme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://junkyardsnearme.com$request_uri;
}

# ── 3. Main Production Server ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name junkyardsnearme.com;

    # ── SSL ──────────────────────────────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/junkyardsnearme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/junkyardsnearme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://js.authorize.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://junkyardsnearme.com https://www.google-analytics.com https://stats.g.doubleclick.net; frame-src https://js.authorize.net https://accept.authorize.net; worker-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # ── Legacy 301 Redirects ──────────────────────────────────────────────────
    # Generated from redirect_map.csv via scripts/generate_nginx_redirects.py
    # Include only if the map file exists:
    # include /etc/nginx/jynm_redirects.conf;

    # ── Document root (React Vite build output) ───────────────────────────────
    root /var/www/jynm/dist;
    index index.html;

    # ── Static assets: immutable cache (Vite content-hashes filenames) ────────
    location /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000";
        gzip_static on;
        try_files $uri =404;
    }

    # ── images, fonts in /public ──────────────────────────────────────────────
    location ~* \.(ico|png|jpg|jpeg|gif|webp|avif|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # ── robots.txt — public, short cache ─────────────────────────────────────
    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # ── sitemap.xml — proxy to Django (dynamic) ───────────────────────────────
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000/api/common/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=21600";  # 6-hour cache
    }

    # ── API proxy → Gunicorn ──────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 15s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 64k;
    }

    # ── Django Admin ──────────────────────────────────────────────────────────
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Ad click tracking (root-level Django endpoint) ────────────────────────
    location /ads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Media files (vendor logos, uploads) ───────────────────────────────────
    location /media/ {
        alias /var/www/jynm/backend/media/;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # ── Django static (admin panel CSS/JS) ───────────────────────────────────
    location /static/ {
        alias /var/www/jynm/backend/staticfiles/;
        add_header Cache-Control "public, immutable, max-age=31536000";
        gzip_static on;
        try_files $uri =404;
    }

    # ── SPA fallback: all non-file requests → React index.html ───────────────
    # This enables React Router to handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/jynm_access.log combined;
    error_log  /var/log/nginx/jynm_error.log warn;

    # ── Proxy error pages ────────────────────────────────────────────────────
    proxy_intercept_errors off;

    # ── Max upload for vendor media ───────────────────────────────────────────
    client_max_body_size 20M;
}
